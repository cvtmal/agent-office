name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/harness/**', 'docs/rpi-cycles.md']
  pull_request:
    paths-ignore: ['docs/harness/**', 'docs/rpi-cycles.md']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: make install
      - run: make lint
      - run: make test
